<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500">
<title>一区一个核心，区内共享台地，区间组合分层</title><desc>三个相邻的同类功能区，各有一个核心和配套建筑，各区以本区核心取高，共同组成较大的功能片区。数量与高差仅为示意。</desc>
<rect width="1080" height="500" rx="16" fill="#f6f3ec"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#283c3b">
<text x="36" y="44" font-size="25" font-weight="600">一区一核心，区内共台，区间分层</text>
<text x="36" y="76" font-size="16" fill="#67746d">相邻小区共同形成一片大的功能区域；不合成一个巨型阵列</text>
